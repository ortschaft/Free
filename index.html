<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broken Viruses</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        .shortcut-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shortcut-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .shortcut-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .shortcut-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .shortcut-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .shortcut-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #8b949e;
        }

        /* Fake Warning Overlay */
        #warning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 17, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .warning-box {
            background-color: var(--card-bg);
            border: 1px solid #f85149;
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(248, 81, 73, 0.2);
        }

        .warning-box h2 {
            color: #f85149;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .warning-box p {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .warning-btn {
            background-color: #f85149;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .warning-btn:hover {
            background-color: #da3633;
        }

        @media (max-width: 480px) {
            .shortcut-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .shortcut-btn {
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <!-- Fake Warning Overlay mit Audiostart -->
