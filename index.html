<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --ui-border: #333;
            --accent: #444;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Overlay für den Initialisierungsprozess */
        #entry-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #code-stream {
            font-size: 0.7rem;
            color: #00ff41; /* Klassisches Hacker-Grün */
            width: 80%;
            height: 200px;
            overflow: hidden;
            margin-bottom: 20px;
            text-align: left;
        }

        .enter-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--accent);
            padding: 10px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Hauptinhalt */
        .container { width: 90%; max-width: 500px; display: none; }
        h1 { font-size: 1rem; border-bottom: 1px solid var(--accent); padding-bottom: 10px; }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #111; font-size: 0.85rem; }
        .item a { color: #555; text-decoration: none; }
        .item a:hover { color: #fff; }
    </style>
</head>
<body>

    <audio id="bg-audio" src="Horror.mp3" loop></audio>

    <div id="entry-overlay">
        <div id="code-stream"></div>
        <button class="enter-btn" id="start-btn" onclick="initSystem()">Initialize Access</button>
    </div>

    <div class="container" id="main-content">

            <div class="item"><span>KSign</span> <a href="https://www.icloud.com/shortcuts/1b74f098f6ac4c59855732a7e84e02cf">EXEC_OPEN</a></div>

            <div class="item"><span>PHIM TẮT HACK 4G⚡️</span> <a href="https://www.icloud.com/shortcuts/cab11f9120864b919e8f868e3c0216c4">EXEC_OPEN</a></div>
        </div>
    </div>

    <script>
        function initSystem() {
            document.getElementById('start-btn').style.display = 'none';
            const stream = document.getElementById('code-stream');
            
            // "Berechnung" starten
            let interval = setInterval(() => {
                stream.innerHTML += "CALCULATING_HASH: " + Math.random().toString(36).substring(2, 15) + "<br>";
                stream.scrollTop = stream.scrollHeight;
            }, 50);

            // Nach 3 Sekunden alles umschalten
            setTimeout(() => {
                clearInterval(interval);
                // Vollbild
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen();
                
                document.getElementById('entry-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('bg-audio').play();
            }, 3000);
        }
    </script>
</body>
