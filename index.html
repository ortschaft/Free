<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --ui-border: #333;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Seriöses Overlay */
        #entry-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .terminal-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .enter-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .enter-btn:hover {
            border-color: #fff;
            background-color: #111;
        }

        /* Hauptinhalt */
        .container {
            width: 90%;
            max-width: 500px;
            display: none; /* Erst nach Klick sichtbar */
        }

        h1 { font-size: 1.2rem; font-weight: 300; border-bottom: 1px solid var(--ui-border); padding-bottom: 10px; margin-bottom: 20px; }

        .item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1a1a1a; font-size: 0.9rem; }
        .item a { color: #666; text-decoration: none; transition: 0.3s; }
        .item a:hover { color: #fff; }
    </style>
</head>
<body>

    <audio id="bg-audio" src="Horror.mp3" loop></audio>

    <div id="entry-overlay">
        <div class="terminal-text">SESSION_REQUIRED // AUTHENTICATION_PENDING</div>
        <button class="enter-btn" onclick="initSystem()">Initialize Access</button>
    </div>

    <script>
        function initSystem() {
            // Vollbildmodus
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();

            // Overlay ausblenden, Inhalt zeigen
            document.getElementById('entry-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // Audio starten
            document.getElementById('bg-audio').play();
        }
